<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<title>Yuval SpA · App Contingencias</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<!-- Icono de la pantalla de inicio -->
<link rel="apple-touch-icon" sizes="180x180" href="icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icono-512.png">
<link rel="manifest" href="manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contingencias">
<meta name="theme-color" content="#0B1730">
<meta name="mobile-web-app-capable" content="yes">

<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0B1730;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #marco { position:fixed; inset:0; width:100%; height:100%; border:0; display:none;
    padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  .pantalla { position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:28px;
    color:#8FA5C6; text-align:center; font-size:14px; line-height:1.5; }
  .pantalla img { width:96px; height:96px; border-radius:20px; }
  .giro { width:26px; height:26px; border:3px solid #24406E; border-top-color:#FFC400;
    border-radius:50%; animation:girar .8s linear infinite; }
  @keyframes girar { to { transform:rotate(360deg) } }
  @media (prefers-reduced-motion:reduce){ .giro{ animation:none } }
  a.boton { display:inline-block; background:#FFC400; color:#241C00; padding:16px 26px;
    border-radius:12px; font-weight:600; font-size:16px; text-decoration:none; margin-top:6px; }
  .oculto { display:none !important; }
</style>
</head>
<body>

<div id="cargando" class="pantalla">
  <img src="icono-192.png" alt="">
  <div class="giro"></div>
  <div>Abriendo App Contingencias</div>
</div>

<div id="manual" class="pantalla oculto">
  <img src="icono-192.png" alt="">
  <div style="color:#CBD9EE;font-size:16px;font-weight:600">App Contingencias</div>
  <a class="boton" id="enlaceDirecto" href="#">Entrar</a>
</div>

<iframe id="marco" allow="geolocation; camera"></iframe>

<script>
/* =========================================================================
   PEGUE AQUI LA URL DE SU APLICACION (la que termina en /exec)
   ========================================================================= */
var URL_APP = 'https://script.google.com/a/macros/yuval.cl/s/AKfycbyGKfCWLvRPXEfX43jTULmh1pJGhi5Un3d0rLqu6oPg8JaOXrQyE49hwEpAoYcC4Ejn/exec';

/* -------------------------------------------------------------------------
   Por que hay dos comportamientos distintos
   -------------------------------------------------------------------------
   Android permite mostrar la aplicacion dentro de esta pagina, asi que se usa
   un contenedor y queda a pantalla completa.

   iOS no. Safari trae activado "Impedir seguimiento entre sitios", que bloquea
   las cookies de script.google.com cuando el contenido viene dentro de otra
   pagina. Apps Script las necesita, y sin ellas la aplicacion no arranca.
   Por eso en iPhone esta pagina solo entrega el icono y redirige de inmediato:
   la aplicacion se abre en su propio contexto, donde funciona sin problemas.
   ------------------------------------------------------------------------- */
var esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

document.getElementById('enlaceDirecto').href = URL_APP;

if (esIOS) {
  // Se muestra el boton por si el navegador bloquea la redireccion automatica
  setTimeout(function () {
    document.getElementById('cargando').classList.add('oculto');
    document.getElementById('manual').classList.remove('oculto');
  }, 2500);
  window.location.replace(URL_APP);

} else {
  var marco = document.getElementById('marco');
  marco.src = URL_APP;
  marco.addEventListener('load', function () {
    document.getElementById('cargando').classList.add('oculto');
    marco.style.display = 'block';
  });
  setTimeout(function () {
    if (marco.style.display !== 'block') {
      document.getElementById('cargando').classList.add('oculto');
      document.getElementById('manual').classList.remove('oculto');
    }
  }, 12000);
}
</script>

</body>
</html>
