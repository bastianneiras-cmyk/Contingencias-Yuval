<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<title>Yuval SpA · App Contingencias</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- Sin cache: el navegador debe pedir siempre la version actual de esta
     pagina. Es minuscula, asi que no cuesta nada, y evita que quede pegada
     una version antigua en el telefono. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<!-- Icono en la pantalla de inicio -->
<link rel="apple-touch-icon" sizes="180x180" href="icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Contingencias">
<meta name="theme-color" content="#0B1730">

<style>
  html,body{margin:0;padding:0;min-height:100%;background:#0B1730;
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .caja{min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;padding:30px;text-align:center;color:#8FA5C6;}
  .caja img{width:110px;height:110px;border-radius:24px;}
  .titulo{color:#FFFFFF;font-size:19px;font-weight:700;letter-spacing:.04em;}
  .boton{display:inline-block;background:#FFC400;color:#241C00;padding:17px 34px;
    border-radius:12px;font-weight:700;font-size:17px;text-decoration:none;}
  .pie{font-size:12px;color:#5B729A;}
</style>
</head>
<body>

<div class="caja">
  <img src="icono-192.png" alt="">
  <div class="titulo">APP CONTINGENCIAS</div>
  <a class="boton" id="entrar"
     href="https://script.google.com/a/macros/yuval.cl/s/AKfycbyGKfCWLvRPXEfX43jTULmh1pJGhi5Un3d0rLqu6oPg8JaOXrQyE49hwEpAoYcC4Ejn/exec">
     Entrar
  </a>
  <div class="pie">Inversiones Yuval SpA</div>
</div>

<script>
// Redireccion automatica. Si el navegador la bloquea, el boton Entrar queda
// disponible: la pagina nunca se queda en blanco.
setTimeout(function () {
  window.location.href = document.getElementById('entrar').href;
}, 700);
</script>

</body>
</html>
